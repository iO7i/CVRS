# Generated from reviewed action-lock.json; owner activation still required.
name: CVRS code scanning
'on':
  push:
    branches:
    - main
  schedule:
  - cron: 23 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
      with:
        languages: python, actions
        build-mode: none
    - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
