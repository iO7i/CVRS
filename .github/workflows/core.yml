# Generated from reviewed action-lock.json; owner activation still required.
name: CVRS core
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core Linux (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e ".[adoption]" pytest jsonschema
    - run: python -m pytest -m "not native" --junitxml=core-tests.xml
    - run: python -m compileall -q src
    - run: python -m cvsubstrate release contribution-check . --verify
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: core-linux-${{ matrix.python }}
        path: core-tests.xml
        if-no-files-found: error
  platform:
    name: Core ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          python: '3.12'
          slug: windows-3.12
        - os: macos-latest
          python: '3.12'
          slug: macos-3.12
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e ".[adoption]" pytest jsonschema
    - run: python -m pytest -m "not native" --junitxml=core-tests.xml
    - run: python -m compileall -q src
    - run: python -m cvsubstrate release contribution-check . --verify
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: core-${{ matrix.slug }}
        path: core-tests.xml
        if-no-files-found: error
