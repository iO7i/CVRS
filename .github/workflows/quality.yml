# Generated from reviewed action-lock.json; owner activation still required.
name: CVRS quality
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install -e ".[adoption,dev,docs]"
    - run: python tools/dev.py lint
    - run: python tools/dev.py typecheck
    - run: python -m mkdocs build --strict --site-dir ../mkdocs-check
    - run: python -m cvsubstrate docs portal . --out ../docs-check
    - run: python -m cvsubstrate docs link-check ../docs-check
  coco:
    name: Official COCO parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python -m pip install -e ".[adoption,coco]" pytest jsonschema
    - run: python -m pytest -q -m coco tests/test_evaluation.py tests/test_slice02_heritage.py --junitxml=coco-tests.xml
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: official-coco-tests
        path: coco-tests.xml
        if-no-files-found: error
