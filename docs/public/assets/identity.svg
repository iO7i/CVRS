<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="title desc"><title id="title">CV Research Substrate</title><desc id="desc">Native environments connect through materialized outputs to shared research evidence.</desc><rect width="800" height="320" fill="#102331"/><g fill="#eaf1f5" font-family="sans-serif"><text x="42" y="62" font-size="30">CV Research Substrate</text><text x="42" y="100" font-size="17">Keep models native. Make evidence portable.</text></g><g fill="none" stroke="#8ebdb4" stroke-width="2"><rect x="42" y="150" width="185" height="72" rx="8"/><rect x="307" y="150" width="185" height="72" rx="8"/><rect x="572" y="150" width="185" height="72" rx="8"/><path d="M227 186H307M492 186H572"/></g><g fill="#eaf1f5" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="134" y="193">Native workers</text><text x="399" y="193">Explicit artifacts</text><text x="665" y="193">Research evidence</text></g><text x="42" y="283" fill="#9fb3c2" font-family="sans-serif" font-size="14">Independent environments, not automatic cross-worker gradients.</text></svg>